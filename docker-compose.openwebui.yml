services:
  admissions-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: admissions-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_DB_PATH: /app/chroma_db
      SQL_DB_PATH: /app/admissions_structured.db
      API_AUTH_KEY: ${API_AUTH_KEY:-openwebui-local-key}
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./admissions_structured.db:/app/admissions_structured.db
      - ./review_log.jsonl:/app/review_log.jsonl
      - ./trace_log.jsonl:/app/trace_log.jsonl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "8000:8000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      admissions-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WEBUI_NAME: Admissions Assistant
      ENABLE_SIGNUP: "false"
      OPENAI_API_BASE_URL: http://admissions-api:8000/v1
      OPENAI_API_KEY: ${API_AUTH_KEY:-openwebui-local-key}
      DEFAULT_MODELS: admissions-rag
      ENABLE_OPENAI_API: "true"
      OFFLINE_MODE: "true"
    volumes:
      - openwebui-data:/app/backend/data
    ports:
      - "3000:8080"

volumes:
  openwebui-data:
